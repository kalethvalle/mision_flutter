services:
  flutter-quest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FLUTTER_IMAGE: ${FLUTTER_IMAGE:-ghcr.io/cirruslabs/flutter:beta}
    container_name: flutter-quest
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - flutter_quest_data:/app/data

volumes:
  flutter_quest_data:
